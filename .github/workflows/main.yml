name: Build macOS DMG Premiere Downgrader V1.0.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai dat Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai thu vien & Tao Icon
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install flask pywebview pillow pyinstaller
          python make_icon.py

      - name: Bien dich ung dung macOS (.app)
        run: |
          ICON_ARG=""
          if [ -f "app_icon.icns" ]; then ICON_ARG="--icon app_icon.icns"; fi
          pyinstaller --noconfirm --windowed --onedir \
            --name "ROOT FILM - Premiere Downgrader V1.0.1" \
            $ICON_ARG \
            --add-data "src/templates:templates" \
            --osx-bundle-identifier "com.rootfilm.prdowngrader" \
            src/app.py

      - name: Dong goi file .DMG + .ZIP
        run: |
          APP_PATH="dist/ROOT FILM - Premiere Downgrader V1.0.1.app"
          xattr -cr "$APP_PATH" || true
          codesign --force --deep --sign - "$APP_PATH" || true

          mkdir -p release_output dmg_stage
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release_output/ROOT_FILM_Premiere_Downgrader_V1.0.1_Mac.zip"

          cp -R "$APP_PATH" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "ROOT FILM Pr V1.0.1" -srcfolder dmg_stage -ov -format UDZO "release_output/ROOT_FILM_Premiere_Downgrader_V1.0.1_Mac.dmg"

      - name: Xuat file cai dat de tai ve
        uses: actions/upload-artifact@v4
        with:
          name: ROOT_FILM_Premiere_Downgrader_V1.0.1_macOS
          path: release_output/*
